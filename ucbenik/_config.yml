title: Računalniški praktikum
author: Katja Berčič, Matija Pretnar
copyright: "2024"

# Skrita poglavja se sploh ne zgradijo: brez strani, brez iskalnega indeksa.
# Poglavje razkrijemo tako, da ga odstranimo od tod IN odkomentiramo v _toc.yml.
exclude_patterns:
  - 13-utrdimo-osnove.md
  - 11-mathematica-2.md
  - 13-animiranje-vektorji-matrike.md
repository:
  url: 'https://github.com/katjabercic/racunalniski-praktikum'

# Prosojnice iz imenika predavanja/ objavimo skupaj z učbenikom.
sphinx:
  config:
    language: sl
    # Slike oštevilčimo po slovensko; privzeto je "Fig. 9".
    numfig_format:
      figure: "Slika %s"
    # Gumb za kopiranje v primerih iz Mathematice kopira le vnos, brez oznak In in Out.
    copybutton_prompt_text: "In\\[\\d+\\]:= "
    copybutton_prompt_is_regexp: true
    copybutton_only_copy_prompt_lines: true
    # Vnos, ki se nadaljuje v naslednji vrstici, se konča z vejico.
    copybutton_line_continuation_character: ","

#   extra_extensions:
#     - sphinx_proof
  local_extensions:
    predavanja: 'extensions/'
    mathematica_celice: 'extensions/'
    # semantic: 'extensions/'

