## Markdown

---

```
[Markdown](https://www.markdownguide.org) je preprost, a zelo
razširjen _označevalni jezik_, ki omogoča hitro pisanje
strukturiranih dokumentov **brez zapletenih orodij**. Zanj
običajno uporabljamo končnico `.md`. Njegov osnovni namen je:

> “Olajšati pisanje za splet v čisti, berljivi obliki.”
> — John Gruber

Ključne prednosti Markdowna so:
- **berljivost** izvornega besedila,
- združljivost s sistemi za **nadzor različic** in s
  `programsko kodo`,
- **pretvorljivost** v različne formate (HTML, PDF, LaTeX …).
```
