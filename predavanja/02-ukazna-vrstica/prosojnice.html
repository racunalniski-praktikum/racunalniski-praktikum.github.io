```plaintext
> Kolikokrat je Gornik omenjen v podnapisih?
```
<!-- .element: style="font-size: 0.42em" -->

- - -

```plaintext
● Bash(cd /tmp/claude/-c-Users-ana-rp/5e0f2c7a/scratchpad)

● Bash(ls ~/Downloads | grep -E "srt|pdf")
  ⎿  podnapisi.srt
      skrati.pdf

● Bash(cat ~/Downloads/podnapisi.srt | grep -E "Gornik(a|u|om)?|Grozd" > omembe.txt)

● Bash(grep -c "Gornik" omembe.txt)
  ⎿  91

Gornik je omenjen v 91 vrsticah. Vse omembe sem shranil v omembe.txt.
```

## `pwd`, `ls`, `cd`

```shell
$ pwd
/c/Users/ana
$ ls
Desktop  Documents  Downloads  rp
$ cd rp/racunalniski-praktikum
$ pwd
/c/Users/ana/rp/racunalniski-praktikum
$ cd ..
$ pwd
/c/Users/ana/rp
```

---

## `echo`, `cat`

```shell
$ cd ~/Downloads
$ echo Zdravo
Zdravo
$ cat podnapisi.srt
1
00:00:38,756 --> 00:00:44,116
... Takó je torej današnji dan — dan
veselja in svečanih občutkov za ves naš
…
```

---

## `>`

```shell
$ echo Zdravo > pozdrav.txt
$ cat pozdrav.txt
Zdravo
$ echo Adijo > pozdrav.txt
$ cat pozdrav.txt
Adijo
```

`>` datoteko prepiše brez vprašanja
<!-- .element: class="fragment" -->

---

## `|`

```shell
$ ls ~/Downloads
podnapisi.srt  skrati.pdf
$ ls ~/Downloads | grep srt
podnapisi.srt
```

## Regularni izrazi

---

| vzorec | pomen |
| --- | --- |
| `.` | poljuben znak |
| `[Gg]` | eden od naštetih |
| `[a-z]` | eden iz razpona |
| `\d` | števka |

---

| vzorec | pomen |
| --- | --- |
| `?` | nič ali enkrat |
| `+` | enkrat ali večkrat |
| `*` | nič ali večkrat |
| `\|` | izbira |
| `(…)` | skupina |

---

## `grep -E`

```shell
$ grep -cE "Gornik|Grozd" podnapisi.srt
119
```
